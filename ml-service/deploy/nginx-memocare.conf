# Nginx site for the MemoCare server. Copy to /etc/nginx/sites-available/memocare,
# replace YOUR_DOMAIN, then run certbot (see ml-service/DEPLOY.md) to add HTTPS.
server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 25m;      # photos, audio clips and family enrolment uploads
    proxy_read_timeout 180s;       # stories, video diary and summaries can take a while
    proxy_send_timeout 180s;

    location /ai/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /caregiver/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
    }
    location /dementia/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
    }
    # Node API (if it runs on the same server)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
